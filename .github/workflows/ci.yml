name: CI

on:
  push:
    branches: [ v1 ]
  pull_request:
    branches: [ v1 ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Python unit tests (no DB secrets)
        run: env -u DATABASE_URL pytest -q

      - name: Verify no prompt files committed
        run: |
          PROMPT_FILES=$(git ls-files | grep -iE 'ANTIGRAVITY_|docs/.*round|docs/.*prompt|probe_output' || true)
          if [ -n "$PROMPT_FILES" ]; then
            echo "Error: Forbidden prompt files tracked in git: $PROMPT_FILES"
            exit 1
          fi

      - name: Verify no data files committed
        run: |
          DATA_FILES=$(git ls-files 'data/*' | grep -v '\.gitkeep$' || true)
          if [ -n "$DATA_FILES" ]; then
            echo "Error: Forbidden data files tracked in git: $DATA_FILES"
            exit 1
          fi

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npx eslint src

      - name: Run JavaScript test suite
        run: npm run test:js

      - name: Run Next.js build (smoke check with dummy secrets)
        env:
          AUTH_SECRET: ci-dummy-secret-32chars-minimum-xxxx
        run: npx next build
